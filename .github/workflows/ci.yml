name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  extension:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out extension
        uses: actions/checkout@v4
        with:
          path: avenger-zed

      - name: Check out the pinned avenger-sql grammars
        uses: actions/checkout@v4
        with:
          repository: avenger-vis/tree-sitter-avenger-sql
          ref: a1d478b510a0f254e1723d20a7dd0728db717dca
          path: tree-sitter-avenger-sql

      - name: Check out the pinned Typst grammar
        uses: actions/checkout@v4
        with:
          repository: avenger-vis/tree-sitter-avenger-typst
          ref: 5c830ae2686f46d195456dec3f475024cfc52e7d
          path: tree-sitter-avenger-typst

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.6
          cache: pnpm
          cache-dependency-path: avenger-zed/pnpm-lock.yaml

      - name: Set up Rust extension target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Install test tools
        run: pnpm install --frozen-lockfile
        working-directory: avenger-zed

      - name: Audit extension package
        run: pnpm check
        working-directory: avenger-zed

      - name: Test Rust LSP adapter
        run: cargo test --locked
        working-directory: avenger-zed

      - name: Build Rust LSP adapter for Zed
        run: cargo check --locked --target wasm32-wasip2
        working-directory: avenger-zed

      - name: Verify the copies of the grammars' queries
        run: pnpm sync:queries -- --grammars .. --check
        working-directory: avenger-zed

      - name: Parse the smoke scripts
        run: pnpm test:fixtures -- --grammars ..
        working-directory: avenger-zed
