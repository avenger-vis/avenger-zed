name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  extension:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out extension
        uses: actions/checkout@v4
        with:
          path: avenger-zed

      - name: Check out pinned grammar
        uses: actions/checkout@v4
        with:
          repository: avenger-vis/tree-sitter-avenger
          ref: aa3029d64770c77803e32a271d0c0e6749d9a346
          path: tree-sitter-avenger

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.6
          cache: pnpm
          cache-dependency-path: avenger-zed/pnpm-lock.yaml

      - name: Set up Rust extension target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Install test tools
        run: pnpm install --frozen-lockfile
        working-directory: avenger-zed

      - name: Audit extension package
        run: pnpm check
        working-directory: avenger-zed

      - name: Test Rust LSP adapter
        run: cargo test --locked
        working-directory: avenger-zed

      - name: Build Rust LSP adapter for Zed
        run: cargo check --locked --target wasm32-wasip1
        working-directory: avenger-zed

      - name: Verify grammar-owned query copies
        run: pnpm sync:queries -- --grammar-root ../tree-sitter-avenger --check
        working-directory: avenger-zed

      - name: Audit query node contract
        run: pnpm check:query-contract -- --grammar-root ../tree-sitter-avenger
        working-directory: avenger-zed

      - name: Test queries and capture baselines
        run: pnpm test:queries -- --grammar-root ../tree-sitter-avenger
        working-directory: avenger-zed

      - name: Measure query performance
        run: pnpm measure:queries -- --grammar-root ../tree-sitter-avenger
        working-directory: avenger-zed
