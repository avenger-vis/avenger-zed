id = "avenger"
name = "Avenger"
version = "0.1.0"
schema_version = 1
authors = ["Jon Mease and Avenger contributors"]
description = "avenger-sql support: scripts (.av.sql), modules (.av.sqlm), Quarto 2 documents (.av.qmd), the language server, and the debugger"
repository = "https://github.com/avenger-vis/avenger-zed"

[grammars.avenger_sql]
repository = "https://github.com/avenger-vis/tree-sitter-avenger-sql"
rev = "21dee1bc664226bd4d30c6e39ca29933f01c4393"

# GoogleSQL's format strings and the values of its date, time, and range literals, which Avenger
# SQL injects, from their directories of the same repository and revision.
[grammars.avenger_format]
repository = "https://github.com/avenger-vis/tree-sitter-avenger-sql"
rev = "21dee1bc664226bd4d30c6e39ca29933f01c4393"
path = "format"

[grammars.avenger_datetime]
repository = "https://github.com/avenger-vis/tree-sitter-avenger-sql"
rev = "21dee1bc664226bd4d30c6e39ca29933f01c4393"
path = "datetime"

# Quarto 2's grammar of Quarto Markdown, which tree-sitter-avenger-sql vendors under its own name,
# since Zed refuses an extension's grammar named `markdown`, the name of one that Zed builds in.
[grammars.avenger_qmd]
repository = "https://github.com/avenger-vis/tree-sitter-avenger-sql"
rev = "21dee1bc664226bd4d30c6e39ca29933f01c4393"
path = "qmd"

# The Typst subset of avenger's labels, which Avenger SQL injects into the strings of markup.
[grammars.avenger_typst]
repository = "https://github.com/avenger-vis/tree-sitter-avenger-typst"
rev = "5c830ae2686f46d195456dec3f475024cfc52e7d"

[language_servers.avenger-lsp]
name = "Avenger Language Server"
languages = ["Avenger SQL", "Avenger Quarto", "Quarto"]
language_ids = { "Avenger SQL" = "avenger-sql", "Avenger Quarto" = "quarto", Quarto = "quarto" }

# Quarto 2's language server, `q2 lsp`, for Avenger Quarto alone: an `.av.qmd` name is the opt-in to
# Quarto 2, whose syntax is stricter than Quarto 1's, so Quarto 1 documents of the Quarto language
# take none of its errors.
[language_servers.quarto2-lsp]
name = "Quarto 2 Language Server"
languages = ["Avenger Quarto"]
language_ids = { "Avenger Quarto" = "quarto" }

# `avenger dap`, which debugs a query's stages, and the locator that turns the run arrows' task,
# `avenger view`, into a session of it on the arrow's statement.
[debug_adapters.avenger]
schema_path = "debug_adapter_schemas/avenger.json"

[debug_locators.avenger]
