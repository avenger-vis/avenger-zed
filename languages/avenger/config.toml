name = "Avenger"
grammar = "avenger"
path_suffixes = ["avenger"]
first_line_pattern = "^\\s*avenger\\s+1\\s*;"
line_comments = ["-- "]
tab_size = 2
hard_tabs = false
brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = false },
  { start = "'", end = "'", close = true, newline = false },
  { start = "\"", end = "\"", close = true, newline = false },
]
